<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Local Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Hello World!</h1>
    <p>My localhost website is working.</p>

    <button id="btn">Click Me</button>

    <h1>Restful Booker Demo</h1>

    <label for="bookingId">Booking ID:</label>
    <input type="number" id="bookingId" placeholder="Enter booking ID">

    <button id="loadBookings">
        Load Booking
    </button>

    <div id="bookingResult"></div>

    <button id="allBookings">
        Load All Booking List
    </button>

    <div id="allBookingResult"></div>

    <form id="login-form">
  <h1>Sign in</h1>
 
  <label for="username">Username</label>
  <input type="text" id="username" name="username" autocomplete="username" required>
 
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
 
  <button type="submit" id="submit-btn">Sign in</button>
 
  <div id="message" class="message"></div>
</form>
    <script src="js/script.js"></script>
    <!-- <script src="js/booking.js"></script> -->
</body>

</html>
