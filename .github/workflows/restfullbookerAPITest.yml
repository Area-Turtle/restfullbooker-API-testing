name: Restfull Booker API Tests

on:
  push:
  workflow_dispatch:

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Start Node server
      - name: Start Node server
        env:
          PORT: 3000
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      # 5. Wait for server
      - name: Wait for server
        run: npx wait-on http://localhost:3000

      # 6. Check server health
      - name: Health check
        run: curl --fail http://localhost:3000/api/ping

      # 7. Run Postman Collection
      - name: Run Postman Collection
        run: |
          npx newman run "postman/Restful-Booker-API_Testing.postman_collection.json" \
            -e "postman/Restful-Booker-Testing.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      # 8. Upload Newman results
      - name: Upload Newman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results.xml

      # 9. Upload server logs if something fails
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log