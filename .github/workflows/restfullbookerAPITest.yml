name: Restfull Booker API Tests

on:
  push:
  workflow_dispatch:

jobs:

  # 1. Lint
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2. Security
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=critical

  # 3. Jest Unit Tests
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test:unit

  # 4. Newman API Tests
  run-postman-tests:
    name: Newman API Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Start Node server
      - name: Start Node server
        env:
          PORT: 3000
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      # 5. Wait for server
      - name: Wait for server
        run: npx wait-on http://localhost:3000

      # 6. Check server health
      - name: Health check
        run: curl --fail http://localhost:3000/

      # 7. Run Postman Collection
      - name: Run Postman Collection
        run: |
          npx newman run "postman/Restful-Booker-API_Testing.postman_collection.json" \
            -e "postman/Restful-Booker-Testing.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      # 8. Upload Newman results
      - name: Upload Newman Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results.xml

      # 9. Upload server logs if something fails
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log

  # 5. Playwright E2E Tests
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Node server
        env:
          PORT: 3000
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-server-logs
          path: server.log