name: Restfull Booker API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. LINT
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # 2. SECURITY
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=critical

  # 3. UNIT TESTS
  unit-tests:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test:unit

  # 4. API TESTS
  postman-tests:
    name: Newman API Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Node server
        env:
          PORT: 3000
          BASE_URL: http://localhost
          SERVER_API_URL: https://restful-booker.herokuapp.com
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Check server process
        run: |
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api/ping --timeout 30000

      - name: Health check
        run: curl --fail http://localhost:3000/api/ping

      - name: Run Postman Collection
        run: |
          npx newman run "postman/Restful-Booker-API_Testing.postman_collection.json" \
            -e "postman/Restful-Booker-Testing.postman_environment.json" \
            --reporters cli,junit \
            --reporter-junit-export results.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: results.xml

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newman-server-logs
          path: server.log

  # 5. E2E TESTS
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, security]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Node server
        env:
          PORT: 3000
          BASE_URL: http://localhost
          SERVER_API_URL: https://restful-booker.herokuapp.com
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Check server process
        run: |
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api/ping --timeout 30000

      - name: Health check
        run: curl --fail http://localhost:3000/api/ping

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-server-logs
          path: server.log